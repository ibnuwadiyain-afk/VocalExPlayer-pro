name: Android Build

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0, or leave empty for automatic tag)'
        required: false
        default: ''
      release_name:
        description: 'Release Title'
        required: false
        default: ''
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "Gradle wrapper not found. Generating wrapper..."
            if command -v gradle >/dev/null 2>&1; then
              gradle wrapper
            else
              sudo apt-get update && sudo apt-get install -y gradle
              gradle wrapper
            fi
          fi
          chmod +x ./gradlew

      - name: Setup Gradle and Enable Build Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          build-scan-publish: false

      - name: Setup Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ] || [ ! -s "debug.keystore" ]; then
            echo "Generating debug.keystore via keytool..."
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "Debug keystore verified ($(wc -c < debug.keystore) bytes)."

      - name: Setup Environment and Configuration Files
        env:
          ENV_SECRET: ${{ secrets.ENV_FILE }}
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # 1. Handle .env file
          if [ -n "$ENV_SECRET" ]; then
            echo "Writing .env from GitHub Secrets..."
            echo "$ENV_SECRET" > .env
          elif [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              echo "Copying .env from .env.example..."
              cp .env.example .env
            else
              echo "Creating empty .env..."
              touch .env
            fi
          fi

          # 2. Handle google-services.json matching applicationId
          python3 scripts/setup_google_services.py

      - name: Build Debug APK
        run: ./gradlew assembleDebug --build-cache --stacktrace

      - name: Prepare APK Release Artifacts
        run: |
          mkdir -p release-artifacts
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILD_NUM="${{ github.run_number }}"
          # Copy standard named APKs
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/VocalExtractor-v1.0.${BUILD_NUM}-${SHORT_SHA}-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/VocalExtractor-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/app-debug.apk
          echo "Release artifacts ready:"
          ls -lh release-artifacts/

      - name: Upload Build Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: VocalExtractor-APK-${{ github.run_number }}
          path: release-artifacts/
          retention-days: 30

      - name: Push Built APK to GitHub Release Directly
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name != '' && github.event.inputs.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number)) }}
          name: ${{ github.event.inputs.release_name != '' && github.event.inputs.release_name || (startsWith(github.ref, 'refs/tags/') && format('Release {0}', github.ref_name) || format('Release v1.0.{0}', github.run_number)) }}
          body: |
            ## VocalExtractor Automated APK Release 🚀

            - **Commit**: `${{ github.sha }}`
            - **Branch**: `${{ github.ref_name }}`
            - **Build Number**: `${{ github.run_number }}`
            - **Date**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')

            ### Included APK Downloads:
            - **`VocalExtractor-debug.apk`**: Latest debug build with vocal isolation, offline Whisper subtitles, and SRT translated dubbing.
            - **`VocalExtractor-v1.0.${{ github.run_number }}-${SHORT_SHA}-debug.apk`**: Versioned build for this specific commit.
            - **`app-debug.apk`**: Standard release package name.
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            release-artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK to Google Drive (Optional)
        if: env.RCLONE_CONFIG_B64 != ''
        continue-on-error: true
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG }}
        run: |
          set -euo pipefail
          echo "Installing rclone..."
          curl https://rclone.org/install.sh | sudo bash
          
          mkdir -p ~/.config/rclone
          CONF=~/.config/rclone/rclone.conf
          
          if echo "$RCLONE_CONFIG_B64" | base64 -d > "$CONF" 2>/dev/null; then
            echo "✅ Base64 decoded successfully."
          else
            printf '%s\n' "$RCLONE_CONFIG_B64" > "$CONF"
          fi
          
          if grep -q '^\[gdrive\]' "$CONF"; then
            APK_DIR="app/build/outputs/apk/debug"
            TIMESTAMP=$(date -u +'%Y-%m-%d_%H-%M-%S')
            REMOTE_DIR="gdrive:VocalExPlayer-Builds/${TIMESTAMP}"
            rclone copy "$APK_DIR" "$REMOTE_DIR" --include "*.apk" --progress --verbose || true
            echo "✅ Uploaded to $REMOTE_DIR"
          else
            echo "⚠️ No [gdrive] remote found, skipping Google Drive upload."
          fi

