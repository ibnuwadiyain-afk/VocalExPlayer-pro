name: Android Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "Gradle wrapper not found. Generating wrapper..."
            if command -v gradle >/dev/null 2>&1; then
              gradle wrapper
            else
              sudo apt-get update && sudo apt-get install -y gradle
              gradle wrapper
            fi
          fi
          chmod +x ./gradlew

      - name: Setup Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ] || [ ! -s "debug.keystore" ]; then
            echo "Generating debug.keystore via keytool..."
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "Debug keystore verified ($(wc -c < debug.keystore) bytes)."

      - name: Setup Environment and Configuration Files
        env:
          ENV_SECRET: ${{ secrets.ENV_FILE }}
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # 1. Handle .env file
          if [ -n "$ENV_SECRET" ]; then
            echo "Writing .env from GitHub Secrets..."
            echo "$ENV_SECRET" > .env
          elif [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              echo "Copying .env from .env.example..."
              cp .env.example .env
            else
              echo "Creating empty .env..."
              touch .env
            fi
          fi

          # 2. Handle google-services.json matching applicationId
          python3 scripts/setup_google_services.py

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Install rclone
  run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
  run: |
    mkdir -p ~/.config/rclone
    echo '${{ secrets.RCLONE_CONFIG }}' > ~/.config/rclone/rclone.conf

      - name: Upload APK to Google Drive
  run: |
    rclone copy app/build/outputs/apk/debug/app-debug.apk \
      gdrive:VocalExPlayer-Builds/ --progress
