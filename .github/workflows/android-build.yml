name: Android Build

on:
  push:
    branches: [ "main", "master" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write   # required to create releases

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "Gradle wrapper not found. Generating wrapper..."
            if command -v gradle >/dev/null 2>&1; then
              gradle wrapper
            else
              sudo apt-get update && sudo apt-get install -y gradle
              gradle wrapper
            fi
          fi
          chmod +x ./gradlew

      - name: Setup Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ] || [ ! -s "debug.keystore" ]; then
            echo "Generating debug.keystore via keytool..."
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "Debug keystore verified ($(wc -c < debug.keystore) bytes)."

      - name: Setup Environment and Configuration Files
        env:
          ENV_SECRET: ${{ secrets.ENV_FILE }}
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # 1. Handle .env file
          if [ -n "$ENV_SECRET" ]; then
            echo "Writing .env from GitHub Secrets..."
            echo "$ENV_SECRET" > .env
          elif [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              echo "Copying .env from .env.example..."
              cp .env.example .env
            else
              echo "Creating empty .env..."
              touch .env
            fi
          fi

          # 2. Handle google-services.json matching applicationId
          python3 scripts/setup_google_services.py

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # ---------- Rename APK for a nicer asset name ----------
      - name: Rename APK
        id: apk
        run: |
          SRC=$(find app/build/outputs/apk/debug -name "*.apk" | head -n1)
          if [ -z "$SRC" ]; then
            echo "❌ No APK found"; exit 1
          fi
          STAMP=$(date -u +'%Y%m%d-%H%M%S')
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          NEW="VocalExPlayer-debug-${STAMP}-${SHORT_SHA}.apk"
          cp "$SRC" "$NEW"
          echo "apk_path=$NEW" >> "$GITHUB_OUTPUT"
          echo "apk_name=$NEW" >> "$GITHUB_OUTPUT"
          ls -lh "$NEW"

      # ---------- GitHub Release upload ----------
      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # If triggered by a tag push → use that tag.
          # Otherwise → auto-tag with build number (e.g. build-123).
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Debug build #{0}', github.run_number) }}
          body: |
            Automated debug build.

            - Commit: `${{ github.sha }}`
            - Branch: `${{ github.ref_name }}`
            - Triggered by: `${{ github.actor }}`
          files: ${{ steps.apk.outputs.apk_path }}
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # ------------------------------------------