name: Android Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "Gradle wrapper not found. Generating wrapper..."
            if command -v gradle >/dev/null 2>&1; then
              gradle wrapper
            else
              sudo apt-get update && sudo apt-get install -y gradle
              gradle wrapper
            fi
          fi
          chmod +x ./gradlew

      - name: Setup Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ] || [ ! -s "debug.keystore" ]; then
            echo "Generating debug.keystore via keytool..."
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "Debug keystore verified ($(wc -c < debug.keystore) bytes)."

      - name: Setup Environment and Configuration Files
        env:
          ENV_SECRET: ${{ secrets.ENV_FILE }}
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$ENV_SECRET" ]; then
            echo "Writing .env from GitHub Secrets..."
            echo "$ENV_SECRET" > .env
          elif [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              echo "Copying .env from .env.example..."
              cp .env.example .env
            else
              echo "Creating empty .env..."
              touch .env
            fi
          fi

          if [ -n "$GOOGLE_SERVICES_SECRET" ]; then
            echo "Writing app/google-services.json from GitHub Secrets..."
            echo "$GOOGLE_SERVICES_SECRET" > app/google-services.json
          elif [ ! -f "app/google-services.json" ]; then
            echo "Creating placeholder app/google-services.json..."
            echo '{"project_info":{"project_number":"000000000000","project_id":"placeholder-project","storage_bucket":"placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000000000","android_client_info":{"package_name":"com.example"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyPlaceholderKeyForBuild00000000"}],"services":{}}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/
          if-no-files-found: error
          retention-days: 21
