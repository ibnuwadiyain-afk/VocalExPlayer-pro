name: Android Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "Gradle wrapper not found. Generating wrapper..."
            if command -v gradle >/dev/null 2>&1; then
              gradle wrapper
            else
              sudo apt-get update && sudo apt-get install -y gradle
              gradle wrapper
            fi
          fi
          chmod +x ./gradlew

      - name: Setup Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ] || [ ! -s "debug.keystore" ]; then
            echo "Generating debug.keystore via keytool..."
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "Debug keystore verified ($(wc -c < debug.keystore) bytes)."

      - name: Setup Environment and Configuration Files
        env:
          ENV_SECRET: ${{ secrets.ENV_FILE }}
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # 1. Handle .env file
          if [ -n "$ENV_SECRET" ]; then
            echo "Writing .env from GitHub Secrets..."
            echo "$ENV_SECRET" > .env
          elif [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              echo "Copying .env from .env.example..."
              cp .env.example .env
            else
              echo "Creating empty .env..."
              touch .env
            fi
          fi

          # 2. Handle google-services.json matching applicationId
          python3 scripts/setup_google_services.py

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG }}
        run: |
          set -euo pipefail
          
          if [ -z "$RCLONE_CONFIG_B64" ]; then
            echo "❌ ERROR: secrets.RCLONE_CONFIG is empty or not set!"
            echo "Please add your rclone config as a base64-encoded secret."
            exit 1
          fi
          
          mkdir -p ~/.config/rclone
          CONF=~/.config/rclone/rclone.conf
          
          # Try base64 decode first
          if echo "$RCLONE_CONFIG_B64" | base64 -d > "$CONF" 2>/dev/null; then
            echo "✅ Base64 decoded successfully."
          else
            echo "⚠️  Base64 decode failed, trying as plain text..."
            printf '%s\n' "$RCLONE_CONFIG_B64" > "$CONF"
          fi
          
          # Validate config has [gdrive] section
          if ! grep -q '^\[gdrive\]' "$CONF"; then
            echo "❌ ERROR: No [gdrive] section found in rclone config!"
            echo "Available sections:"
            grep -E '^\[.*\]$' "$CONF" || echo "  (none found)"
            echo ""
            echo "Your config should look like:"
            echo "  [gdrive]"
            echo "  type = drive"
            echo "  ..."
            exit 1
          fi
          
          echo "✅ Found [gdrive] section in config"
          echo "---- Config sections (redacted) ----"
          grep -E '^\[.*\]$' "$CONF"
          echo "------------------------------------"

      - name: Test rclone connection
        run: |
          echo "Testing rclone connection..."
          rclone listremotes
          echo ""
          rclone lsd gdrive: --max-depth 1

      - name: Upload APK to Google Drive
        run: |
          APK_DIR="app/build/outputs/apk/debug"
          TIMESTAMP=$(date -u +'%Y-%m-%d_%H-%M-%S')
          REMOTE_DIR="gdrive:VocalExPlayer-Builds/${TIMESTAMP}"
          
          if [ ! -d "$APK_DIR" ]; then
            echo "❌ ERROR: APK directory not found: $APK_DIR"
            exit 1
          fi
          
          echo "Uploading APKs from $APK_DIR..."
          rclone copy "$APK_DIR" "$REMOTE_DIR" \
            --include "*.apk" \
            --progress \
            --verbose
          
          echo "✅ Uploaded to $REMOTE_DIR"
